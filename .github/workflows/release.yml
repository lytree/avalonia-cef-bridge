name: release

# 发布流水线（docs/dev-workflow-design.md §6.3 / §10，W0–W5 共同交付）。
#   触发：push tag `tarui-v{version}`（推荐，版本单源）或手动 dispatch。
#   流程：门禁 → 三平台并行（pack-and-build 调用 ./_pack-and-build.yml reusable workflow，
#         windows 跑 zip+msix、macOS 跑 osx-arm64 .app、linux 跑 linux-x64 self-contained zip）
#         → NuGet 拓扑序推送（--skip-duplicate）→ @lytree/api npm publish
#         → softprops/action-gh-release 上传全部产物到 GitHub Release。
#   密钥：GitHub Environments `release` + OIDC 预留（§12）。见 README「发布」节。
on:
  push:
    tags:
      - 'tarui-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（示例 tarui-v0.1.0），缺省将不会覆盖产物版本'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: 发布前门禁
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tarui.net.slnx

      - name: Tag version
        id: vars
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
            if ($v) { $v = $v -replace '^tarui-v', '' } else { $v = '' }
          } else {
            $v = $env:GITHUB_REF_NAME -replace '^tarui-v', ''
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Restore & build (0 warnings/errors)
        run: |
          dotnet restore tarui.net.slnx --configfile NuGet.Config
          dotnet build tarui.net.slnx -c Release --no-restore

      - name: Pack packages for release validation
        run: dotnet pack tarui.net.slnx -c Release --no-build --nologo -o artifacts/nuget

      - name: Tarui.WebView.CefGlueNext package gate
        run: |
          $package = Get-ChildItem artifacts/nuget/Tarui.WebView.CefGlueNext.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'Tarui.WebView.CefGlueNext package was not produced.' }
          dotnet run --project tests/Tarui.Architecture.Tests/Tarui.Architecture.Tests.csproj -c Release --no-build -- --require-package --package $package.FullName

      - name: External NuGet consumer smoke
        run: |
          $package = Get-ChildItem artifacts/nuget/Tarui.WebView.CefGlueNext.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $version = [regex]::Match($package.BaseName, '^Tarui\.WebView\.CefGlueNext\.(.+)$').Groups[1].Value
          $consumer = Join-Path $env:RUNNER_TEMP 'tarui-webview-cefglue-next-consumer'
          Remove-Item $consumer -Recurse -Force -ErrorAction SilentlyContinue
          dotnet new classlib --framework net10.0 --output $consumer --no-restore
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Tarui.WebView.CefGlueNext" Version="$version" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $consumer 'Tarui.WebView.CefGlueNext.Consumer.csproj')
          @"
          using Avalonia.Controls;
          using Tarui.WebView.CefGlueNext;

          public static class ConsumerSmoke
          {
              public static Control CreateControl() => new CefGlueNextAvaloniaWebView();
              public static bool DispatchSubprocess(string[] args) => CefGlueNextAvaloniaRuntime.RunSubProcess(args, false);
          }
          "@ | Set-Content (Join-Path $consumer 'Class1.cs')
          dotnet restore (Join-Path $consumer 'Tarui.WebView.CefGlueNext.Consumer.csproj') --source (Join-Path (Get-Location) 'artifacts/nuget') --source https://api.nuget.org/v3/index.json
          dotnet build (Join-Path $consumer 'Tarui.WebView.CefGlueNext.Consumer.csproj') -c Release --no-restore --nologo

      - name: Run self-tests (eng/test-all.ps1)
        run: ./eng/test-all.ps1 -BaselineCount 21

      - name: Version consistency (Directory.Build.props == @lytree/api == tarui.app.json)
        id: version-check
        run: |
          $tagVersion = '${{ steps.vars.outputs.version }}'
          if (-not $tagVersion) { throw 'Resolved VERSION is empty; check Tag version step.' }
          $props = Select-String -Path Directory.Build.props -Pattern '<TaruiVersion>([^<]+)</TaruiVersion>'
          $tarui = $props.Matches[0].Groups[1].Value
          $npmVersion = (Get-Content web/packages/api/package.json -Raw | ConvertFrom-Json).version
          $manifestPath = 'examples/demo/tarui.app.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest | Get-Member -Name 'product' -MemberType NoteProperty -ErrorAction SilentlyContinue) {
            $appVersion = $manifest.product.version
          } else {
            throw "Manifest '$manifestPath' missing product.version."
          }
          $mismatches = @()
          if ($tarui      -ne $tagVersion) { $mismatches += "Directory.Build.props=$tarui vs tag=$tagVersion" }
          if ($npmVersion -ne $tagVersion) { $mismatches += "@lytree/api=$npmVersion vs tag=$tagVersion" }
          if ($appVersion -ne $tagVersion) { $mismatches += "tarui.app.json=$appVersion vs tag=$tagVersion" }
          if ($mismatches.Count -gt 0) { throw "Version mismatch: $($mismatches -join '; ')" }
          Write-Host "Resolved VERSION = $tagVersion (consistent across Directory.Build.props, @lytree/api, tarui.app.json)."
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$tagVersion"


  publish-dotnet:
    name: 推送 NuGet（OIDC Trusted Publishing，拓扑序，幂等）
    needs: [validate, pack-and-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # 必需——NuGet OIDC 依赖此权限换取短期 token
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tarui.net.slnx

      - name: Download nupkgs from pack-and-build
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name（非邮箱）

      - name: Push to nuget.org (topological, idempotent)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) { throw 'NuGet OIDC login produced no API key.' }
          if (-not $env:VERSION)        { throw 'VERSION from validate.outputs is empty.' }
          $source = if ($env:NUGET_SOURCE) { $env:NUGET_SOURCE } else { 'https://api.nuget.org/v3/index.json' }
          $nupkgs = Get-ChildItem artifacts/nuget/*.nupkg | Sort-Object Name
          if ($nupkgs.Count -eq 0) { throw 'No nupkg produced.' }
          $failed = @()
          foreach ($p in $nupkgs) {
            $id = [System.IO.Path]::GetFileNameWithoutExtension($p.Name)
            $ver = [regex]::Match($id, '\.([0-9].*)$').Groups[1].Value
            if (-not $ver) { $ver = $env:VERSION }
            $flat = "https://api.nuget.org/v3-flatcontainer/$($id.ToLower())/index.json"
            try {
              $existing = Invoke-RestMethod -Uri $flat -TimeoutSec 30
              if ($existing -and ($existing.versions -contains $ver)) {
                Write-Host "[skip] $id $ver already exists on nuget.org ($flat)."
                continue
              }
            } catch {
              Write-Host "[info] $id version query failed ($($_.Exception.Message)); falling back to --skip-duplicate."
            }
            dotnet nuget push $p.FullName --source $source --api-key $env:NUGET_API_KEY --skip-duplicate 2>&1 | ForEach-Object { Write-Host "  $_" }
            if ($LASTEXITCODE -ne 0) { $failed += $p.Name }
          }
          if ($failed.Count -gt 0) { throw "Publish failed for: $($failed -join ', ')" }


  publish-npm:
    name: 发布 @lytree/api 到 npm（OIDC provenance，幂等）
    needs: [validate, pack-and-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # 必需——npm provenance/OIDC 依赖此权限
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Publish @lytree/api (idempotent, OIDC provenance)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::VERSION from validate.outputs is empty"; exit 1; fi
          if npm view "@lytree/api@${VERSION}" version >/dev/null 2>&1; then
            echo "[@lytree/api] ${VERSION} already published on npm; skipping."
            exit 0
          fi
          pnpm --filter @lytree/api publish --access public --no-git-checks --provenance


  pack-and-build:
    name: pack + demo build + cli build (windows zip+msix)
    needs: validate
    uses: ./.github/workflows/_pack-and-build.yml
    with:
      os: windows
      cef_runtime_id: win-x64
      bundle_csv: zip,msix
      rid: win-x64
      installer_artifact: installers
      installer_path: examples/demo/dist/
      nuget_artifact: nuget-packages
      enable_signing: 'true'
      version: ${{ needs.validate.outputs.version }}
    secrets:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PUBLISHER: ${{ secrets.WINDOWS_CERT_PUBLISHER }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_CERT_TIMESTAMP: ${{ secrets.WINDOWS_CERT_TIMESTAMP }}


  pack-and-build-macos:
    name: pack + macOS app bundle (osx-arm64)
    needs: validate
    uses: ./.github/workflows/_pack-and-build.yml
    with:
      os: macos
      bundle_csv: app-bundle
      rid: osx-arm64
      installer_artifact: installers-macos
      installer_path: |
        examples/demo/dist/demo.app/
        examples/demo/dist/demo-*.app.tar.gz
        examples/demo/dist/demo-*.app.tar.gz.sha256
      nuget_artifact: nuget-packages-macos
      plutil_check: 'true'
      version: ${{ needs.validate.outputs.version }}
    # macOS 无需 WINDOWS_CERT_* —— reusable workflow 的 secrets 全部 required: false，直接省略。


  pack-and-build-linux:
    name: pack + Linux self-contained zip (linux-x64)
    needs: validate
    uses: ./.github/workflows/_pack-and-build.yml
    with:
      os: linux
      cef_runtime_id: linux-x64
      bundle_csv: zip
      rid: linux-x64
      installer_artifact: installers-linux
      installer_path: examples/demo/dist/demo-*.zip
      nuget_artifact: nuget-packages-linux
      smoke_test_zip: 'true'
      version: ${{ needs.validate.outputs.version }}


  release:
    name: GitHub Release
    needs: [validate, pack-and-build, pack-and-build-macos, pack-and-build-linux, publish-dotnet, publish-npm]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: installers
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: installers-macos
          path: dist-macos
      - uses: actions/download-artifact@v5
        with:
          name: installers-linux
          path: dist-linux
      - uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: nuget

      - name: Publish GitHub Release (softprops/action-gh-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tarui-v${{ needs.validate.outputs.version }}
          name: tarui ${{ needs.validate.outputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.msix
            dist-macos/*.app.tar.gz
            dist-linux/*.zip
            nuget/*.nupkg
          body: |
            Tarui ${{ needs.validate.outputs.version }} 发布。

            ## 改动

            - **CefGlue.Next.Avalonia 并入 Tarui.WebView.CefGlueNext**：浏览器组件层不再独立成包；包名变化是破坏性变更，对应 NuGet 包名改为 `Tarui.WebView.CefGlueNext`。
            - 同步版本号到 0.4.0（Directory.Build.props / @lytree/api / examples/demo/tarui.app.json / tarui-cli / Tarui.Templates）。

            ## 附件

            - Windows：`demo-0.4.0-win-x64.zip`、`demo-0.4.0-win-x64.msix`
            - macOS (osx-arm64)：`demo-0.4.0-osx-arm64.app.tar.gz`
            - Linux (linux-x64)：`demo-0.4.0-linux-x64.zip`
            - NuGet 包：`*.nupkg`（含 `Tarui.WebView.CefGlueNext.0.4.0.nupkg`、`Tarui.Hosting.0.4.0.nupkg` 等）

            ## 安装与启动

            - **Windows**：解压 zip 或安装 msix，启动 `demo.exe`。
            - **macOS**：
              ```bash
              tar -xzf demo-0.4.0-osx-arm64.app.tar.gz
              xattr -dr com.apple.quarantine demo.app 2>/dev/null || true
              chmod +x demo.app/Contents/MacOS/demo
              open demo.app
              ```
            - **Linux**：
              ```bash
              unzip demo-0.4.0-linux-x64.zip
              ./demo
              ```

            ## 签名状态

            - **MSIX**：未配置签名证书时为未签名包；如需 Authenticode 签名，在 GitHub `release` environment 注入 `WINDOWS_CERT_*` 密钥。
            - **macOS .app**：未签名/未公证，分发前需 `codesign --deep --sign <identity>` 与 `xcrun notarytool submit --wait`（详见 `docs/adr/0002-macos-real-build-pipeline.md` §8）。
            - **Linux zip**：未签名/未打包 deb/rpm/AppImage；分发前可考虑 fpm/electron-builder 等格式（暂未实现，详见 `docs/dev-workflow-design.md` §12 待办）。
            - **NuGet/npm**：均通过 OIDC Trusted Publishing 发布（无需长期 API key）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
