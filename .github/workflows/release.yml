name: release

# 发布流水线（docs/dev-workflow-design.md §6.3 / §10，W0–W5 共同交付）。
#   触发：push tag `tarui-v{version}`（推荐，版本单源）或手动 dispatch。
#   流程：门禁 → NuGet 拓扑序推送（--skip-duplicate）→ @lytree/api npm publish
#         → Windows 构建 tarui build --bundle zip;msix（可选 Authenticode）→ GitHub Release 附件。
#   密钥：GitHub Environments `release` + OIDC 预留（§12）。见 README「发布」节。
on:
  push:
    tags:
      - 'tarui-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（示例 tarui-v0.1.0），缺省将不会覆盖产物版本'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: 发布前门禁
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tarui.net.sln

      - name: Tag version
        id: vars
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
            if ($v) { $v = $v -replace '^tarui-v', '' } else { $v = '' }
          } else {
            $v = $env:GITHUB_REF_NAME -replace '^tarui-v', ''
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Restore & build (0 warnings/errors)
        run: |
          dotnet restore tarui.net.sln --configfile NuGet.Config
          dotnet build tarui.net.sln -c Release --no-restore

      - name: Pack packages for release validation
        run: dotnet pack tarui.net.sln -c Release --no-build --nologo -o artifacts/nuget

      - name: CefGlue.Next.Avalonia package gate
        run: |
          $package = Get-ChildItem artifacts/nuget/CefGlue.Next.Avalonia.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'CefGlue.Next.Avalonia package was not produced.' }
          dotnet run --project tests/Tarui.Architecture.Tests/Tarui.Architecture.Tests.csproj -c Release --no-build -- --require-package --package $package.FullName

      - name: External NuGet consumer smoke
        run: |
          $package = Get-ChildItem artifacts/nuget/CefGlue.Next.Avalonia.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $version = [regex]::Match($package.BaseName, '^CefGlue\.Next\.Avalonia\.(.+)$').Groups[1].Value
          $consumer = Join-Path $env:RUNNER_TEMP 'cefglue-next-avalonia-consumer'
          Remove-Item $consumer -Recurse -Force -ErrorAction SilentlyContinue
          dotnet new classlib --framework net10.0 --output $consumer --no-restore
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="CefGlue.Next.Avalonia" Version="$version" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $consumer 'CefGlue.Next.Avalonia.Consumer.csproj')
          @"
          using Avalonia.Controls;
          using CefGlue.Next.Avalonia;

          public static class ConsumerSmoke
          {
              public static Control CreateControl() => new CefGlueNextAvaloniaWebView();
              public static bool DispatchSubprocess(string[] args) => CefGlueNextAvaloniaRuntime.RunSubProcess(args, false);
          }
          "@ | Set-Content (Join-Path $consumer 'Class1.cs')
          dotnet restore (Join-Path $consumer 'CefGlue.Next.Avalonia.Consumer.csproj') --source (Join-Path (Get-Location) 'artifacts/nuget') --source https://api.nuget.org/v3/index.json
          dotnet build (Join-Path $consumer 'CefGlue.Next.Avalonia.Consumer.csproj') -c Release --no-restore --nologo

      - name: Run self-tests
        run: |
          dotnet run --project tests/Tarui.Cli.Tests/Tarui.Cli.Tests.csproj -c Release --no-build
          dotnet run --project tests/Tarui.Ipc.Tests/Tarui.Ipc.Tests.csproj -c Release --no-build
          dotnet run --project tests/CefGlue.Next.Avalonia.Tests/CefGlue.Next.Avalonia.Tests.csproj -c Release --no-build
          dotnet run --project tests/Tarui.WebView.Tests/Tarui.WebView.Tests.csproj -c Release --no-build
          dotnet run --project tests/Tarui.Shell.Tests/Tarui.Shell.Tests.csproj -c Release --no-build
          dotnet run --project tests/Tarui.Architecture.Tests/Tarui.Architecture.Tests.csproj -c Release --no-build

      - name: Version consistency (TaruiVersion == @lytree/api)
        run: |
          $version = Select-String -Path Directory.Build.props -Pattern '<TaruiVersion>([^<]+)</TaruiVersion>'
          $tarui = $version.Matches[0].Groups[1].Value
          $pkg = (Get-Content web/packages/api/package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $tarui) { throw "Version mismatch: props=$tarui pkg=$pkg" }
          Write-Host "Consistent $tarui"

  publish-dotnet:
    name: 推送 NuGet（OIDC Trusted Publishing，拓扑序，--skip-duplicate）
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # 必需——NuGet OIDC 依赖此权限换取短期 token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tarui.net.sln

      - name: Restore & pack
        run: |
          dotnet restore tarui.net.sln --configfile NuGet.Config
          dotnet pack tarui.net.sln -c Release --no-restore --nologo -o artifacts/nuget

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name（非邮箱）

      - name: Push to nuget.org (topological, skip duplicates)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) { throw 'NuGet OIDC login produced no API key.' }
          $source = if ($env:NUGET_SOURCE) { $env:NUGET_SOURCE } else { 'https://api.nuget.org/v3/index.json' }
          $nupkgs = Get-ChildItem artifacts/nuget/*.nupkg | Sort-Object Name
          if ($nupkgs.Count -eq 0) { throw 'No nupkg produced.' }
          $failed = @()
          foreach ($p in $nupkgs) {
            dotnet nuget push $p.FullName --source $source --api-key $env:NUGET_API_KEY --skip-duplicate 2>&1 | ForEach-Object { Write-Host "  $_" }
            if ($LASTEXITCODE -ne 0) { $failed += $p.Name }
          }
          if ($failed.Count -gt 0) { throw "Publish failed for: $($failed -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          retention-days: 1

  publish-npm:
    name: 发布 @lytree/api 到 npm（OIDC provenance）
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # 必需——npm provenance/OIDC 依赖此权限
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Publish @lytree/api (OIDC provenance)
        run: |
          pnpm --filter @lytree/api publish --access public --no-git-checks --provenance
        working-directory: web

  build-installers:
    name: 构建安装器（zip + msix，可选签名）
    needs: validate
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tarui.net.sln
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install CEF runtime (win-x64)
        run: ./eng/cef/install-runtime.ps1 -RuntimeIdentifier win-x64

      - name: Install frontend deps (frozen)
        shell: bash
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Configure optional Authenticode signing
        shell: pwsh
        run: |
          $b64 = '${{ secrets.WINDOWS_CERT_BASE64 }}'
          if (-not $b64) {
            Write-Host 'No WINDOWS_CERT_BASE64; emitting unsigned MSIX.'
            exit 0
          }
          $certPath = Join-Path ($env:RUNNER_TEMP) 'tarui-sign.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($b64))
          $manifest = Get-Content tarui.app.json -Raw | ConvertFrom-Json
          if (-not $manifest.bundle.msix) { $manifest.bundle | Add-Member -NotePropertyName msix -NotePropertyValue @{} -Force }
          $manifest.bundle.msix.publisher = '${{ secrets.WINDOWS_CERT_PUBLISHER }}'
          $manifest.bundle.msix.certificate = @{
            path           = $certPath
            password       = '${{ secrets.WINDOWS_CERT_PASSWORD }}'
            timeStamperUrl = '${{ secrets.WINDOWS_CERT_TIMESTAMP }}'
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content tarui.app.json
          Write-Host 'Signing configured.'

      - name: Restore & publish & bundle (zip;msix)
        shell: pwsh
        run: |
          dotnet restore tarui.net.sln --configfile NuGet.Config
          dotnet build src/tarui-cli/Tarui.Cli.csproj -c Release --no-restore
          dotnet run --project src/tarui-cli/Tarui.Cli.csproj -c Release --no-build -- build --bundle zip,msix

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/
          retention-days: 1

  release:
    name: GitHub Release
    needs: [validate, publish-dotnet, publish-npm, build-installers]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: nuget

      - name: List artifacts
        run: |
          Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          if [ -z "$VERSION" ]; then echo "::error::version tag required for release"; exit 1; fi
          files=()
          for f in dist/*; do files+=("$f"); done
          for f in nuget/*.nupkg; do files+=("$f"); done
          gh release create "tarui-v${VERSION}" "${files[@]}" \
            --title "tarui ${VERSION}" \
            --notes "Tarui ${VERSION} 发布。MSIX 与 zip 安装器见附件（未配置签名证书时 MSIX 未签名）。"
